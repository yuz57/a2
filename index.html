 <!doctype html>
 <html lang="ja">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>招待制チャット</title>
   <link rel="stylesheet" href="./css/chat.css" />
 </head>
 <body>
   <main class="app">
     <header class="header">
       <div>
         <div class="title" id="roomTitle">招待制チャットルーム</div>
         <div class="sub" id="roomSub"></div>
       </div>
       <div class="actions">
         <button class="btn" id="copyInviteBtn">招待URLをコピー</button>
       </div>
     </header>

       <label for="username">ユーザーネーム</label>

     <section class="messages" id="messages"></section>

       <textarea id="text" rows="1" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）" maxlength="500"></textarea>
       <button type="submit">送信</button>
     </form>
   </main>
   <script type="module" src="./js/chat.js"></script>
 </body>
